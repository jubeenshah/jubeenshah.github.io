n:eye 4s linear infinite}@keyframes eye{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.needle{transform-origin:120px 122px;animation:needle .9s ease-in-out infinite}@keyframes needle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}.seq{animation:seq 3.6s linear infinite backwards}@keyframes seq{0%,100%{opacity:.2}8%,90%{opacity:1}}.ox{animation:ox 4.5s cubic-bezier(.37,0,.63,1) infinite alternate}.oy{animation:oy 4.5s cubic-bezier(.37,0,.63,1) infinite alternate;animation-delay:-2.25s}@keyframes ox{to{transform:translateX(-144px)}}@keyframes oy{from{transform:translateY(-30px)}to{transform:translateY(30px)}}.steam{animation:steam 3s ease-in-out infinite}@keyframes steam{0%{opacity:0;transform:translateY(6px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-12px)}}.eq{transform-box:fill-box;transform-origin:50% 100%;animation:eq 1.1s ease-in-out infinite}@keyframes eq{50%{transform:scaleY(.35)}}.wave{animation:wave 2.4s linear infinite}@keyframes wave{to{transform:translateX(-28px)}}.hop{animation:hop 3.2s steps(1) infinite}@keyframes hop{25%{transform:translateX(30px)}50%{transform:translateX(60px)}75%{transform:translateX(90px)}}.drop{animation:drop 2.6s ease-in infinite}@keyframes drop{0%,100%{transform:translateY(-14px)}35%,80%{transform:translateY(0)}}.scan{animation:scan 2.6s ease-in-out infinite alternate}@keyframes scan{from{transform:translateY(-34px)}to{transform:translateY(34px)}}.snap{animation:sway 1.1s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="10" y1="20" x2="230" y2="220"><stop offset="0" stop-color="#8B5CF6"/><stop offset="0.5" stop-color="#22D3EE"/><stop offset="1" stop-color="#00E08A"/></linearGradient><radialGradient id="disc" cx="0.5" cy="0.42" r="0.62"><stop offset="0" stop-color="#FF4D2E" stop-opacity="0.30"/><stop offset="1" stop-color="#FF4D2E" stop-opacity="0"/></radialGradient><radialGradient id=