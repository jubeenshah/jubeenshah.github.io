frames needle{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(7deg)}}.seq{animation:seq 3.6s linear infinite backwards}@keyframes seq{0%,100%{opacity:.2}8%,90%{opacity:1}}.ox{animation:ox 4.5s cubic-bezier(.37,0,.63,1) infinite alternate}.oy{animation:oy 4.5s cubic-bezier(.37,0,.63,1) infinite alternate;animation-delay:-2.25s}@keyframes ox{to{transform:translateX(-144px)}}@keyframes oy{from{transform:translateY(-30px)}to{transform:translateY(30px)}}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><defs><linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="10" y1="20" x2="230" y2="220"><stop offset="0" stop-color="#8B5CF6"/><stop offset="0.5" stop-color="#22D3EE"/><stop offset="1" stop-color="#00E08A"/></linearGradient><radialGradient id="disc" cx="0.5" cy="0.42" r="0.62"><stop offset="0" stop-color="#38BDF8" stop-opacity="0.30"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient><radialGradient id="glow"><stop offset="0" stop-color="#22D3EE" stop-opacity="0.45"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></radialGradient><radialGradient id="sun"><stop offset="0" stop-color="#F5B301" stop-opacity="0.55"/><stop offset="1" stop-color="#F5B301" stop-opacity="0"/></radialGradient><linearGradient id="leaf" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3DF0A6"/><stop offset="1" stop-color="#00A868"/></linearGradient><linearGradient id="fire" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F5B301"/><stop offset="1" stop-color="#FF4D2E"/></linearGradient><linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFD75A"/><stop offset="1" stop-color="#C98F00"/></linearGradient><clipPath id="in"><circle cx="120" cy="120" r="98"/></clipPath></defs><circle cx="120" cy="120" r="100" fill="#0A0D14"/><circle cx="120" cy="120" r="100" fill="url(#disc)"/><g clip-path="url(#in)"><path d="M120.5 67.5L166.3 46.7" stroke="#38BDF8" stroke-opacity="0.16" stroke-width="1.2