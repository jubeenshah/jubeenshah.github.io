<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="240" height="240" role="img"><style>.rot{transform-origin:120px 120px;animation:rot 60s linear infinite}.orbit{transform-origin:120px 120px;animation:rot 16s linear infinite}@keyframes rot{to{transform:rotate(360deg)}}.float{animation:float 4s ease-in-out infinite}@keyframes float{50%{transform:translateY(-5px)}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-in-out infinite}@keyframes pulse{50%{transform:scale(1.14)}}.tw{transform-box:fill-box;transform-origin:center;animation:tw 2.6s ease-in-out infinite}@keyframes tw{50%{transform:scale(.5);opacity:.35}}.blink{animation:blink 2.4s ease-in-out infinite}@keyframes blink{50%{opacity:.2}}.glow{animation:glow 2.8s ease-in-out infinite}@keyframes glow{50%{opacity:.35}}.cursor{animation:cursor 1.1s steps(1) infinite}@keyframes cursor{50%{opacity:0}}.march{animation:march 1.4s linear infinite}@keyframes march{to{stroke-dashoffset:var(--m)}}.draw{animation:draw 3.4s ease-in-out infinite}@keyframes draw{0%{stroke-dasharray:1;stroke-dashoffset:1}55%,100%{stroke-dasharray:1;stroke-dashoffset:0}}.sway{animation:sway 3.4s ease-in-out infinite}@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}.flick{transform-box:fill-box;transform-origin:50% 100%;animation:flick 1.3s ease-in-out infinite}@keyframes flick{30%{transform:scale(.95,1.06) skewX(-2deg)}65%{transform:scale(1.04,.96) skewX(2deg)}}.flash{animation:flash 2.8s linear infinite}@keyframes flash{0%,44%,56%,66%,100%{opacity:1}50%{opacity:.1}61%{opacity:.3}}.drift{transform-box:fill-box;transform-origin:center;animation:drift 3s ease-in-out infinite}@keyframes drift{50%{transform:translate(6px,-5px) rotate(10deg)}}.eye{transform-box:fill-box;transform-origin:center;animation:eye 4s linear infinite}@keyframes eye{0%,91%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}.needle{transform-origin:120px 122px;animation:needle .9s ease-in-out infinite}@key